name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rubygems-release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '4.0'
      - name: Verify tag and build package
        run: |
          bundle install
          version=$(bundle exec ruby -e 'print Gem::Specification.load("graphql-schema_lint.gemspec").version')
          test "v$version" = "$GITHUB_REF_NAME"
          bundle exec rake test build
          printf 'GEM_PACKAGE=pkg/graphql-schema_lint-%s.gem\n' "$version" >> "$GITHUB_ENV"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push "$GEM_PACKAGE"
